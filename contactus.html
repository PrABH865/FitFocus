<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <style>
      body {
        font-family: fantasy;
        margin: 0;
        padding: 0;
        /* background-image: url("Images/book_15475261\ \(1\).png"); */
        background: linear-gradient(170deg, #716d72 0%, #c0c3a2);
        background-size: cover;
        /* background-repeat: no-repeat; */
        background-position: left;
        background-size: 22rem;
        margin-left: 1rem;
        /* backdrop-filter: blur(3px); */
      }
      nav {
        position: relative;
        z-index: 10;
      }
      nav ul {
        list-style-type: none;
        padding-left: 10px;
        gap: 10px;
        z-index: 5;
        display: flex;
        justify-content: center;
      }
      nav ul li {
        display: inline;
        margin-right: 20px;
      }
      nav ul li a {
        text-decoration: none;
        color: black;
        font-size: 25px;
      }
      nav ul .account {
        display: flex;
        /* justify-content: end; */
        justify-content: space-between;
        padding: 3px 0px 10px 22rem;
        margin-right: 20px;
      }
      nav ul .account button {
        display: flex;
        justify-content: space-between;
        margin-left: 6px;
      }
      #sign-up {
        background: #383737;
        color: white;
      }
      #login {
        background: rgb(30, 114, 30);
        color: white;
      }
      .content {
        padding: 20px;
        background: linear-gradient(300deg, #717277 0%, #c0c3a2);
      }
      .content h2 {
        font-size: 30px;
      }
      .content p {
        font-size: 18px;
      }
      fieldset {
        /* margin-left: 2.3rem; */
        background-image: url("https://imgs.search.brave.com/clmqD4gI3YkNicR9f927mfmRS6eDo4PeljjXSV3ep9Q/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9vbmxp/bmVwbmd0b29scy5j/b20vaW1hZ2VzL2V4/YW1wbGVzLW9ubGlu/ZXBuZ3Rvb2xzL2Rl/c2VydC10cmFuc3Bh/cmVudC5wbmc");
        background-size: cover;
        padding: 60px;
        border-radius: 10px;
        border: 2px solid  black;
      }
      fieldset legend {
        font-size: 30px;
        /* color: #b7c5bc; */
      }
      .contact-form {
        margin-right: 2rem;
        /*  right: 150px;
        padding-right: 200px; */
      }
      .contact-form fieldset {
        margin-top: 20px;
        position: relative;
        right: auto;
        backdrop-filter: blur(10px);
      }
      form {
        display: flex;
        flex-direction: column;
      }
      form input {
        width: 100%;
        padding: 7px;
      }
      textarea{
        width: 100%;
        padding: 7px;
      }
      form button {
        margin-top: 6px;
        padding-top: 5px;
        background: rgb(5, 61, 5);
        color: #c0c3a2;
      }
    </style>
  </head>
  <body>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contactus.html">Contact</a></li>
        <li><a href="nutrition.html">Nutrition</a></li>
        <li><a href="progress.html">Progress</a></li>
        <li><a href="workouts.html">Workouts</a></li>
        <hr />
        <div class="account">
          <button id="sign-up">Sign Up</button>
          <button id="login">Login</button>
        </div>
      </ul>
    </nav>
    <div class="content">
      <div class="contact-form">
        <fieldset>
          <legend><h2>Contact Us</h2></legend>
          <form method="post">
            <label for="name" class="label">Name</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your name"
              required
            />
            <br />
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            />
            <br />
            <label for="password">Password</label>
            <input
              type="password"
              name="password"
              id="password"
              placeholder="Enter your password"
            />
            <br />
            <label for="message">Message:</label>
            <textarea
              id="message"
              name="message"
              aria-placeholder="Enter the feedback"
              rows="5"
              required
            ></textarea>

            <button type="submit">Submit</button>
          </form>
        </fieldset>
        <p>
          If you have any questions, feedback, or need assistance, please feel
          free to reach out to us. We're here to help you on your fitness
          journey.
        </p>
      </div>
    </div>
  </body>
</html>
